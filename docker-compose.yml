# Lokaler Start: docker compose up
# Danach: npm run db:migrate && npm run seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haushalt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haushalt}
      POSTGRES_DB: ${POSTGRES_DB:-haushaltsauktion}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haushalt} -d ${POSTGRES_DB:-haushaltsauktion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haushalt}:${POSTGRES_PASSWORD:-haushalt}@db:5432/${POSTGRES_DB:-haushaltsauktion}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      # ── Todoist-Integration (optional) ────────────────────────────────
      # OHNE INTEGRATION_ENCRYPTION_KEY wird die Integration gar nicht erst
      # zusammengesetzt: kein Worker, keine Routenwirkung, keine Fehlermeldung.
      # "Tut nichts" ist dann KEIN Defekt, sondern genau dieser fehlende Wert.
      # Erzeugen mit:  openssl rand -base64 32
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # Nur während einer Schlüsselrotation setzen — siehe docs/todoist.md.
      INTEGRATION_ENCRYPTION_KEYS: ${INTEGRATION_ENCRYPTION_KEYS:-}
      # Reconcile+Dispatch-Intervall. `0` schaltet den Worker ab.
      #
      # ACHTUNG bei mehr als EINER API-Instanz: der Reconciler muss einzeln
      # laufen. Auf allen Instanzen ausser einer `0` setzen, sonst können zwei
      # Reconciler dieselbe Benachrichtigung doppelt senden und — über einen
      # veralteten Lesevorgang — sogar eine doppelte Todoist-Aufgabe erzeugen.
      # Das ist ein Korrektheitsproblem, keine Kosmetik (siehe docs/todoist.md).
      TODOIST_INTERVAL_SECONDS: ${TODOIST_INTERVAL_SECONDS:-60}
      # ── Web Push (optional) ───────────────────────────────────────────
      # OHNE beide Schlüssel wird Push gar nicht erst zusammengesetzt: kein
      # Versand, keine Fehlermeldung — dieselbe Regel wie bei Todoist oben.
      # Erzeugen mit:  npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
