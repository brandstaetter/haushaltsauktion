# Production compose file for the Lightsail instance — docs/hosting-plan.md §2/§3.
#
# Unlike the repo-root docker-compose.yml (local dev: builds images on the
# fly), api/web here pull pre-built images from ECR — deploy.yml's
# build-and-push job is what puts them there. Only Caddy is exposed to the
# internet (80/443); api/web are reachable only on the compose network.
#
# Lives at /opt/haushaltsauktion/docker-compose.yml on the instance,
# alongside .env (secrets, not in this repo) and Caddyfile.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${ECR_REGISTRY}/haushaltsauktion-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      # Gates POST /api/register — apps/api/src/infra/http/routes/register.ts
      # only registers the route when this is a non-empty string, and
      # apps/api/src/config.ts's schema rejects an empty string outright, so
      # this must never be left set-but-blank in .env.
      SETUP_TOKEN: ${SETUP_TOKEN}
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${ECR_REGISTRY}/haushaltsauktion-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
