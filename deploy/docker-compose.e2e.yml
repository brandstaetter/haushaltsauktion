# Overlay for the throwaway E2E stack used by CI (see
# .github/workflows/deploy.yml, "e2e" job) — never used for local dev or
# production. Applied on top of the repo-root docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.e2e.yml \
#     -p haushaltsauktion-e2e up -d --build --wait
#
# Everything here is disposable: a fresh Postgres volume, images built from
# the current checkout (not pulled from ECR), and dummy credentials that
# only ever exist for the lifetime of one CI job. `docker-compose.yml`
# already defaults SESSION_SECRET/POSTGRES_* to non-secret placeholders when
# unset, so this file only adds what that base file cannot: the
# VITE_DEMO_LOGIN build arg (apps/web/Dockerfile) that makes the E2E
# suite's login flow (e2e/helpers.ts's `loginAsDemoUser`) work against the
# actual built image instead of the Vite dev server, a healthcheck for
# `web` so `--wait` has something to wait on (root compose only healthchecks
# db/api), disabling the background sweep worker — same reasoning as
# playwright.config.ts's `env: { SWEEP_INTERVAL_SECONDS: '0' }` for its
# tsx-based `webServer` entry: a live timer would materialize due instances
# with a future `offerExpiresAt` outside the tests' control, and flow-3's
# manual, test-driven sweep would then find nothing ready — and
# COOKIE_SECURE=false, documented in README.md ("für lokales HTTP auf
# `false` setzen"): this stack is reached over plain `http://127.0.0.1`,
# not HTTPS, so a `Secure` session cookie (config.ts's default) is never
# sent back on subsequent requests and every session looks unauthenticated.
# Found by running the suite against this stack for the first time — every
# session-dependent test failed (flow-3's direct `page.request` call surfaced
# it as a missing CSRF token; flow-4's config save silently 401'd). The
# tsx-based dev-server path never hit this because the developer's own
# `.env` already sets it for local HTTP, but that file is never read by
# these containers.
#
# RATE_LIMIT_MAX (config.ts) is raised well above its production default of
# 300/minute for the same reason: the suite runs single-worker/sequential
# (playwright.config.ts's `workers: 1`) and reuses just two real logins
# (elke, hannes) across every spec file, so their per-session request counts
# accumulate across the *whole* run instead of resetting per test — a long
# flow late in the run can exhaust the production-sized bucket and tip an
# unrelated, earlier-passing test into a `429` on `/auth/me`.
services:
  api:
    environment:
      SWEEP_INTERVAL_SECONDS: "0"
      COOKIE_SECURE: "false"
      RATE_LIMIT_MAX: "5000"

  web:
    build:
      args:
        VITE_DEMO_LOGIN: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 10
