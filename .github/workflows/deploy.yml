# Test → build → push → deploy, per docs/hosting-plan.md §3.
#
# Gitleaks (.github/workflows/gitleaks.yml) is a separate, required status
# check enforced via branch protection on `main` — it gates the merge that
# triggers this workflow, not a job inside it (see hosting-plan.md §9).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ECR_API_REPOSITORY: haushaltsauktion-api
  ECR_WEB_REPOSITORY: haushaltsauktion-web

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haushalt
          POSTGRES_PASSWORD: haushalt
          POSTGRES_DB: haushaltsauktion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haushalt -d haushaltsauktion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://haushalt:haushalt@localhost:5432/haushaltsauktion
      SESSION_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — no long-lived AWS keys stored as secrets
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build and push API image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # optionally require manual approval in repo settings
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Sync compose file and Caddyfile to the instance
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: /opt/haushaltsauktion/.incoming
          strip_components: 1
      - name: Pull latest images and restart the stack on the Lightsail instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/haushaltsauktion
            mv .incoming/docker-compose.prod.yml docker-compose.yml
            mv .incoming/Caddyfile Caddyfile
            rmdir .incoming
            aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 637423428697.dkr.ecr.eu-central-1.amazonaws.com
            if grep -q '^SETUP_TOKEN=' .env; then
              sed -i "s#^SETUP_TOKEN=.*#SETUP_TOKEN=${{ secrets.SETUP_TOKEN }}#" .env
            else
              echo "SETUP_TOKEN=${{ secrets.SETUP_TOKEN }}" >> .env
            fi

            # Synced from GitHub Secrets the same way as SETUP_TOKEN above,
            # rather than requiring a one-time manual edit of the instance's
            # .env — that manual step is exactly what got missed after initial
            # provisioning and left this key unset in production. An empty
            # secret still lands as an empty string here, which
            # apps/api/src/config.ts and main.ts already treat as "integration
            # not configured" rather than an error (see docs/todoist.md), so
            # this is safe to run unconditionally on every deploy.
            if grep -q '^INTEGRATION_ENCRYPTION_KEY=' .env; then
              sed -i "s#^INTEGRATION_ENCRYPTION_KEY=.*#INTEGRATION_ENCRYPTION_KEY=${{ secrets.INTEGRATION_ENCRYPTION_KEY }}#" .env
            else
              echo "INTEGRATION_ENCRYPTION_KEY=${{ secrets.INTEGRATION_ENCRYPTION_KEY }}" >> .env
            fi

            # Visibility check — mirrors apps/api/src/main.ts's own `hasKey`
            # check. Without this key the API boots fine and composes
            # nothing for Todoist (no crash, no error, see docs/todoist.md),
            # so a missing key is otherwise invisible until a member reports
            # they can't connect their account. Now that the key above is
            # synced from a GitHub Secret, this mainly catches that secret
            # having been left empty.
            if grep -qE '^INTEGRATION_ENCRYPTION_KEYS?=.+' .env; then
              echo "INTEGRATION_ENCRYPTION_KEY(S) is set on this instance."
            else
              echo "::warning::INTEGRATION_ENCRYPTION_KEY is not set (the GitHub Secret is empty or missing). Any household with the Todoist integration enabled in Admin Settings will have members unable to connect their own token. See docs/todoist.md."
            fi

            docker compose pull
            docker compose up -d

            # `docker compose up -d` exiting 0 only means the containers
            # were *started* — it says nothing about whether they stayed
            # up. Poll until every service has left its startup healthcheck
            # window, and fail loudly (with logs) on a crash-looping, exited,
            # or unhealthy container instead of reporting green regardless.
            echo "Waiting for the stack to report healthy..."
            attempt=0
            max_attempts=24 # 24 * 5s = 120s bounded window
            until [ "$attempt" -ge "$max_attempts" ]; do
              status="$(docker compose ps)"
              if echo "$status" | grep -qE 'Restarting|Exit|unhealthy'; then
                echo "::error::A service is crash-looping, exited, or unhealthy after deploy."
                echo "$status"
                docker compose logs --tail=200
                exit 1
              fi
              if ! echo "$status" | grep -q 'starting'; then
                echo "$status"
                echo "All services settled."
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Timed out waiting for the stack to become healthy."
              docker compose ps
              docker compose logs --tail=200
              exit 1
            fi

            docker image prune -f
