# Serves the built SPA and reverse-proxies /api/* to the `api` compose
# service, matching how apps/web/vite.config.ts's dev-server proxy and
# apps/web/src/api/client.ts's relative `/api/...` fetches both already
# assume the API lives under the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (apps/web/src/router.tsx): any path that isn't a
    # real static asset falls back to index.html so a deep link like
    # /aufgaben/abc123 doesn't 404 on a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's build hashes every filename under /assets/ (index-<hash>.js), so
    # a changed file is a changed URL — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker itself, its registration script, and the manifest
    # must never be cached long-lived: `vite-plugin-pwa`'s `autoUpdate` relies
    # on the browser re-checking `sw.js` reasonably often to discover a new
    # build. A stale cached `sw.js` would strand installed clients on an old
    # version indefinitely (CDNs/proxies-in-front-of-nginx are the real risk;
    # Chrome itself already refuses to cache-serve a >24h-old worker, but this
    # keeps the origin's own behavior correct regardless of what sits in
    # front of it).
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Exact match (highest-priority location type in nginx, ahead of the
    # regex block above) so this one rule owns both concerns for the
    # manifest: nginx's default mime.types has no .webmanifest entry (it
    # would otherwise fall back to application/octet-stream, not the correct
    # type per the Web App Manifest spec), and it must never be cached
    # long-lived for the same reason as the service worker files above.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # No path rewrite: the Fastify server registers every route under an
    # `/api` prefix itself (apps/api/src/infra/http/server.ts), so `/api/foo`
    # here maps straight to `/api/foo` on the `api` service.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }
}
